id: salt-master-2
interface: 10.77.0.12
publish_port: 44505
ret_port: 44506
open_mode: True
auto_accept: True
log_level: info
log_granular_levels:
  salt.cluster: debug
  salt.transport: info

cluster_id: master_cluster
cluster_peers:
  - salt-master-1
  - salt-master-3
  - salt-master-4
  - salt-master-5
cluster_pki_dir: /etc/salt/cluster-pki

file_roots:
  base:
    - /srv/salt

worker_threads: 10
ipc_write_buffer: 104857600
