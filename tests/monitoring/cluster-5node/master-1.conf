id: salt-master-1
# Bind to 0.0.0.0, not the static ipv4_address (10.77.0.11).  Docker
# reassigns the eth0 IP after ``docker network disconnect/connect`` and
# any static bind leaves salt-master's LISTEN sockets attached to an
# address that is no longer on the interface.  0.0.0.0 keeps the
# ret/pub sockets valid across IPAM churn.
interface: 0.0.0.0
publish_port: 44505
ret_port: 44506
open_mode: True
auto_accept: True
log_level: info
log_granular_levels:
  salt.cluster: debug
  salt.transport: info

cluster_id: master_cluster
cluster_peers:
  - salt-master-2
  - salt-master-3
  - salt-master-4
  - salt-master-5
cluster_pki_dir: /etc/salt/cluster-pki

file_roots:
  base:
    - /srv/salt

worker_threads: 10
ipc_write_buffer: 104857600
