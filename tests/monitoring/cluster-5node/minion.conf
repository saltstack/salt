master_type: failover
master:
  - 10.77.0.11
  - 10.77.0.12
  - 10.77.0.13
  - 10.77.0.14
  - 10.77.0.15
master_port: 44506
# status.master() alive-check scans the OS TCP table for connections on this
# port. Must match the master's publish_port (44505). Default is 4505, which
# would fire a false __master_disconnected every time the alive-check runs.
publish_port: 44505
master_alive_interval: 30
master_shuffle: True
retry_dns: 10
log_level: info
ipc_write_buffer: 104857600
