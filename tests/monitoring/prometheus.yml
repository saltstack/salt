global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'salt-fds'
    static_configs:
      - targets: ['salt-master:8002']

  # The master's own metrics when ``metrics.exporter: prometheus``.  The
  # target is simply down when that exporter is not enabled.
  - job_name: 'salt-metrics'
    static_configs:
      - targets: ['salt-master:9464']
