id: salt-master-1
interface: 10.77.1.11
publish_port: 44505
ret_port: 44506
open_mode: True
auto_accept: True
log_level: debug
log_granular_levels_disabled:
  salt.master: debug
  salt.cache._cluster_replicator: debug
  salt.cluster: debug
  salt.transport: info

cluster_id: scale_test
cluster_isolated_filesystem: True
cluster_peers:
  - salt-master-2
  - salt-master-3
cluster_pki_dir: /etc/salt/cluster-pki

file_roots:
  base:
    - /srv/salt/states

pillar_roots:
  base:
    - /srv/salt/pillar/base

worker_threads: 3
ipc_write_buffer: 104857600

# Resource registry scale knobs
resource_registry_put_many_yield: 1024

# is "replicate" (N-of-N); set to "ring" to measure 1-of-N partitioning.

# Lift payload cap for cluster/peer/delegate events (ring + replicate).
max_event_size: 268435456

# Enable async MWorker: 5 concurrent requests per worker via coroutines
master_async_mworker: True
master_mworker_max_inflight: 5

cluster_cache_routing:
  resource_grains: ring

cache: mmap_cache


enable_grain_trie_index: True
