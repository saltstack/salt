id: salt-master-2
interface: 10.77.1.12
publish_port: 44505
ret_port: 44506
open_mode: True
auto_accept: True
log_level: debug
log_granular_levels_disabled:
  salt.master: debug
  salt.cache._cluster_replicator: debug
  salt.cluster: debug
  salt.transport: info

cluster_id: scale_test
cluster_isolated_filesystem: True
cluster_peers:
  - salt-master-1
  - salt-master-3
cluster_pki_dir: /etc/salt/cluster-pki

file_roots:
  base:
    - /srv/salt/states

pillar_roots:
  base:
    - /srv/salt/pillar/base

worker_threads: 10
ipc_write_buffer: 104857600

resource_registry_put_many_yield: 1024


# Lift payload cap for cluster/peer/delegate events (ring + replicate).
max_event_size: 268435456
