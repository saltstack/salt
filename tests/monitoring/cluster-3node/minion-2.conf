id: scale-minion-2
master: salt-haproxy
master_port: 44506
publish_port: 44505
master_alive_interval: 30
retry_dns: 10
log_level: debug
ipc_write_buffer: 104857600

# Resource registry opts
resource_types:
  - dummy
dummy_resource_count: 200000
process_count_max: 5
dummy_resource_persist_state: False
acceptance_wait_time: 2
acceptance_wait_time_max: 10
return_retry_timer: 60
return_retry_timer_max: 60
open_mode: True

dummy_resource_id_prefix: b-
