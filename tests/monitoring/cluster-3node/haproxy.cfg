global
    maxconn 10000
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 2h
    timeout server 2h
    option tcplog
    log global

# Minion ret_port (TCP req/rep)
frontend salt-ret
    bind *:44506
    default_backend masters-ret

backend masters-ret
    balance roundrobin
    server salt-master-1 salt-master-1:44506 check
    server salt-master-2 salt-master-2:44506 check
    server salt-master-3 salt-master-3:44506 check

# Minion pub_port (TCP pub/sub)
frontend salt-pub
    bind *:44505
    default_backend masters-pub

backend masters-pub
    balance roundrobin
    server salt-master-1 salt-master-1:44505 check
    server salt-master-2 salt-master-2:44505 check
    server salt-master-3 salt-master-3:44505 check
