[pytest]
# Isolate the resiliency suite from the top-level tests/conftest.py gate
# (which pytest.fails any test file outside tests/pytests/).  Running
# pytest with this file as -c / rootdir stops conftest discovery at
# tests/resiliency/ so the parent gate never runs.
#
# Recommended invocation:
#   pytest -c tests/resiliency/pytest.ini \
#          --confcutdir=tests/resiliency \
#          tests/resiliency/
#
# Or from inside the dir:
#   cd tests/resiliency && pytest --confcutdir=.
#
# run_resiliency.sh (wave 4) hard-codes the right flags.
testpaths = .
# confcutdir is set via --confcutdir on the CLI because pytest.ini doesn't
# accept it declaratively; see the wrapper script for the actual pass.

# Default CLI options when running the resiliency suite.
addopts = -ra --tb=short -p no:cacheprovider

# Register the custom marks so pytest doesn't warn about unknown ones.
# These are also registered in conftest.py's pytest_configure, but
# declaring them here lets `pytest --markers` list them.
markers =
    topology(*names): skip the test unless the active --topology is one of these
    marathon: require --marathon to opt in (multi-hour runtime)
    setup_error_on_fail: failures in this test are recorded as setup_error in results.jsonl

# Prevent pytest from recursing into compose/ or results/
norecursedirs = compose results artifacts panels
