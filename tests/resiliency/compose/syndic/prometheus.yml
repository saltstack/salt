global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: syndic

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          cluster: syndic

  # fd_exporter.py launched via start_exporters.sh inside each master.
  # Reachable by container name on the shared salt-net.
  - job_name: 'salt-masters'
    static_configs:
      - targets:
          - 'rs-syndic-mom:8002'
          - 'rs-syndic-sub:8002'
        labels:
          cluster: syndic
