# Minion for the syndic resiliency topology.  Points at the sub-master
# (which also runs salt-syndic reporting upward to syndic-mom).  The id
# is left unset here so each container's /etc/salt/minion_id (populated
# from the container hostname) wins -- the compose file assigns
# syndic-minion-1 / syndic-minion-2 as hostnames.
master: syndic-sub
master_port: 44506
publish_port: 44505

open_mode: True
auto_accept: True

# Keep retrying forever; scenario drivers assume the minion reconnects
# once any injected fault clears.
master_tries: -1

log_level: info
