# Minion for the syndic resiliency topology.  Points at the sub-master
# (which also runs salt-syndic reporting upward to syndic-mom).  The id
# is left unset here so each container's /etc/salt/minion_id (populated
# from the container hostname) wins -- the compose file assigns
# syndic-minion-1 / syndic-minion-2 as hostnames.
master: syndic-sub
master_port: 44506
publish_port: 44505

open_mode: True
auto_accept: True

# Aggressive reconnect pacing -- same profile as compose/single/minion.conf.
# Without master_alive_interval the minion defaults to 0 (keepalive
# disabled) and cannot detect that the sub-master went away; a 90 s
# network disconnect leaves the zmq socket in a stale half-open state
# that never self-heals when the master returns.  Confirmed locally:
# syndic hit "2/2 minion(s) did not answer test.ping within 180s" on
# test_orch_docker_network_disconnect because the minion never kicked
# its reconnect loop.
master_alive_interval: 5
auth_timeout: 15
acceptance_wait_time: 1
acceptance_wait_time_max: 5
retry_dns: 2

# TCP keepalive: default tcp_keepalive_idle is 300 s, which leaves
# the minion's half-open ESTAB socket in place for 5 min after
# ``docker network disconnect`` severs the sub's netstack.
# status.master checks /proc/net/tcp and sees ESTAB -> returns True
# -> no __master_disconnected event -> no reconnect.  Drop the idle
# to 30 s so the kernel probes a dead TCP inside the test window.
tcp_keepalive: True
tcp_keepalive_idle: 30
tcp_keepalive_intvl: 10
tcp_keepalive_cnt: 3

# Keep retrying forever; scenario drivers assume the minion reconnects
# once any injected fault clears.
master_tries: -1

log_level: info
