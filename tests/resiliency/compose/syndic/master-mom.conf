id: syndic-mom
# Bind to 0.0.0.0, not the static ipv4_address -- see master-sub.conf
# for the full rationale.  Docker reassigns the eth0 IP after a
# ``docker network disconnect/connect``; binding on 0.0.0.0 keeps the
# LISTEN sockets valid regardless of which address the interface
# currently holds and lets the ret_port recover without a hard
# container recreate.
interface: 0.0.0.0
publish_port: 44505
ret_port: 44506

open_mode: True
auto_accept: True

# Allow salt-syndic daemons to connect upward and publish on behalf of
# their downstream minions.  Without this the MoM would refuse the
# syndic's auth attempt and the resiliency stack can't register.
order_masters: True

log_level: info
worker_threads: 3
