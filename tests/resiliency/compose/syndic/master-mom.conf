id: syndic-mom
interface: 10.99.0.11
publish_port: 44505
ret_port: 44506

open_mode: True
auto_accept: True

# Allow salt-syndic daemons to connect upward and publish on behalf of
# their downstream minions.  Without this the MoM would refuse the
# syndic's auth attempt and the resiliency stack can't register.
order_masters: True

log_level: info
worker_threads: 3
