id: syndic-sub
interface: 10.99.0.12
publish_port: 44505
ret_port: 44506

open_mode: True
auto_accept: True

# This host runs BOTH salt-master (for the downstream minions) and
# salt-syndic (reporting upward to the MoM).  The syndic daemon reads
# ``syndic_master`` from the master config to locate its upstream.
syndic_master: syndic-mom

# Keep syndic logs separate from master logs for triage.
syndic_log_file: /var/log/salt/syndic

log_level: info
worker_threads: 3
