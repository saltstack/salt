id: syndic-sub
# Bind to 0.0.0.0, not the static ipv4_address.  Docker's IPAM reassigns
# the container's eth0 IP after ``docker network disconnect/connect``
# (10.99.0.12 -> 10.99.0.2 locally).  salt-master binds its ret/pub
# sockets at startup; if a static-IP bind is baked into the config
# the subsequent reconnect leaves LISTEN sockets on an address that
# is no longer on the interface, and any container restart then fails
# with "The salt master is shutdown. The ports are not available to
# bind".  0.0.0.0 keeps the LISTEN sockets valid regardless of which
# address the interface currently holds.  Minions resolve ``syndic-sub``
# via Docker DNS, which does track the reassigned IP.
interface: 0.0.0.0
publish_port: 44505
ret_port: 44506

open_mode: True
auto_accept: True

# This host runs BOTH salt-master (for the downstream minions) and
# salt-syndic (reporting upward to the MoM).  The syndic daemon reads
# ``syndic_master`` from the master config to locate its upstream.
syndic_master: syndic-mom

# Keep syndic logs separate from master logs for triage.
syndic_log_file: /var/log/salt/syndic

log_level: info
worker_threads: 3
