id: mm-salt-master-a
# Bind to 0.0.0.0, not the static ipv4_address (10.88.0.11).  Docker
# reassigns the eth0 IP after ``docker network disconnect/connect``
# (and leaves a brief gap on ``docker restart`` where eth0 exists but
# the ipv4 is not yet attached); binding on 0.0.0.0 keeps the ret/pub
# sockets valid regardless of which address the interface currently
# holds and sidesteps the restart-time EADDRNOTAVAIL race entirely.
interface: 0.0.0.0
publish_port: 44505
ret_port: 44506

open_mode: True
auto_accept: True

log_level: info
worker_threads: 3
