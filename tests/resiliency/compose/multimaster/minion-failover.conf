id: mm-minion-1

# Failover multi-master: minion connects to one master at a time and
# fails over on loss.  ``master_alive_interval`` controls how quickly
# the minion notices the current master is dead.
master_type: failover
master:
  - mm-salt-master-a
  - mm-salt-master-b
master_port: 44506
publish_port: 44505

master_alive_interval: 15
master_shuffle: True
# Keep retrying forever; the scenario drivers assume the minion will
# reconnect once faults clear.
master_tries: -1
# Note: salt/minion.py refuses to start with master_type=failover AND
# retry_dns non-zero.  Keep this at 0.
retry_dns: 0

open_mode: True
log_level: info
