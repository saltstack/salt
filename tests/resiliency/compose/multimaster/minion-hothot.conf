id: mm-minion-1

# Hot-hot multi-master: minion connects to BOTH masters simultaneously
# via salt.minion.MultiMinion.  This is salt's default list-of-masters
# behavior when ``master_type`` is left at its default value "str"
# (see salt/minion.py _spawn_minions: masters list is not collapsed
# unless master_type is "failover" or "distributed").
master_type: str
master:
  - mm-salt-master-a
  - mm-salt-master-b
master_port: 44506
publish_port: 44505

master_alive_interval: 15
retry_dns: 10
master_tries: -1

open_mode: True
log_level: info
