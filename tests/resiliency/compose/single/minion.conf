# Resiliency-specific single-topology minion config.
#
# Intentionally aggressive reconnect pacing so test runtime stays
# bounded.  The resiliency suite's invariant is "minion reconnects
# within a bounded window after the fault clears"; default-config
# minion timing can push cold-restart reconnect past 180s (default
# master_alive_interval=30s + acceptance_wait_time growing to 60s +
# salt-master warm-up), which would make every master-restart phase
# a false-negative FAIL even when reconnect does eventually happen.
#
# These knobs are TEST-ONLY and are NOT recommended for production
# minions -- the aggressive retry pacing increases master CPU load
# and is a bad default for real deployments.

master: salt-master
master_port: 44506
publish_port: 44505
log_level: warning
ipc_write_buffer: 104857600

# Snap the keepalive miss-detection down from 30s to 5s so the
# reconnect loop starts firing within seconds of the master going away.
master_alive_interval: 5

# Auth-attempt deadline: 15s (default 60s).  Fault-recovery has to
# span multiple auth attempts anyway; a tighter deadline means
# each attempt is cheaper on failure.
auth_timeout: 15

# Backoff between auth attempts: start at 1s, cap at 5s (defaults
# 10s/60s).  A fast ramp means the minion will almost certainly
# have a connect attempt pending when the master finishes starting.
acceptance_wait_time: 1
acceptance_wait_time_max: 5

# Return-channel retries also tightened.
return_retry_timer: 5
return_retry_timer_max: 10

# Unlimited retries -- the resiliency scenarios ARE the test of
# whether recovery converges, so the minion must never give up.
master_tries: -1
