global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: single

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: salt-masters
    static_configs:
      - targets: ['salt-master:8002']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
