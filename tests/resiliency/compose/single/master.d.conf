# Resiliency-specific master drop-in (bind-mounted at
# /etc/salt/master.d/resiliency.conf).  Salt reads master.d/*.conf
# automatically on startup; we use a drop-in instead of editing the
# shared tests/monitoring/master.conf so this change doesn't bleed
# into the stress-test stack.
#
# pillar_roots points at /srv/pillar (bind-mounted rw from the
# resiliency single compose).  Needed by test_fs_pillar_flip_mid_run
# which rewrites a pillar top.sls mid-run and verifies the flip
# propagates.
pillar_roots:
  base:
    - /srv/pillar
