[build-system]
requires = [
    "setuptools>=64.0",
    "wheel",
    "looseversion",
    "packaging",
    "importlib-metadata>=8.7.0",
]
build-backend = "salt_build_backend"
backend-path = ["tools/pkg"]

[project]
name = "salt"
description = "Portable, distributed, remote execution and configuration management system"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache Software License 2.0"}
authors = [
  {name = "Thomas S Hatch", email = "thatch45@gmail.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://saltproject.io"

[tool.black]
exclude= """
/(
    salt/ext
  | templates
)/
"""

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
skip="salt/ext,templates"
known_third_party = [
  "pytest"
]

[tool.ruff]
# Match the minimum Python version declared by this project.
target-version = "py38"
line-length = 88
extend-exclude = ["salt/ext", "templates"]
# Names Salt injects into modules at load time. Keep in sync with
# additional-builtins in .pylintrc.
builtins = [
    "__opts__",
    "__utils__",
    "__salt__",
    "__pillar__",
    "__grains__",
    "__context__",
    "__runner__",
    "__ret__",
    "__env__",
    "__low__",
    "__states__",
    "__lowstate__",
    "__running__",
    "__active_provider_name__",
    "__master_opts__",
    "__jid_event__",
    "__instance_id__",
    "__salt_system_encoding__",
    "__proxy__",
    "__serializers__",
    "__reg__",
    "__executors__",
    "__events__",
    "__resource_funcs__",
    "napalm_device",
]

[tool.ruff.lint]
# Correctness checks, alongside Salt's pylint plugins. Only new violations
# block a PR (see tools/precommit/ruff.py). Black remains the formatter, so no
# style rules are enabled. Type checking is a separate rollout.
select = [
    "F",     # pyflakes
    "B004",  # unreliable callable check
    "B005",  # strip() with multi-character strings
    "B006",  # mutable argument defaults
    "B015",  # useless comparisons
    "B017",  # assertRaises/pytest.raises(Exception)
    "B018",  # useless expressions
    "B020",  # loop variable overrides the iterable
    "B023",  # loop variables captured without binding
    "B025",  # duplicate exception in try/except
    "B026",  # star-arg unpacking after a keyword argument
    "B034",  # re.sub/split/subn positional count or flags
    "B039",  # mutable ContextVar default
    "E711",  # comparison to None
    "E712",  # comparison to True/False
    "E713",  # "not x in y"
    "E714",  # "not x is y"
    "E721",  # type comparison with ==
    "E722",  # bare except
    "PLE",   # pylint errors
    "RUF006",  # asyncio task reference dropped
    "W605",  # invalid escape sequence
]
ignore = [
    "F403",  # star imports
    "F405",  # names from star imports
    "F841",  # unused variables
]
[tool.towncrier]
    package = "salt"
    filename = "CHANGELOG.md"
    directory = "changelog/"
    template = "changelog/.template.jinja"
    start_string = "# Changelog\n"
    underlines = ["", "", ""]
    title_format = "## {version} ({project_date})"
    issue_format = "[#{issue}](https://github.com/saltstack/salt/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "removed"
        name = "Removed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecated"
        name = "Deprecated"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "changed"
        name = "Changed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "fixed"
        name = "Fixed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "added"
        name = "Added"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "security"
        name = "Security"
        showcontent = true
