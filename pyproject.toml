[build-system]
requires = [
    "setuptools>=64.0",
    "wheel",
    "looseversion",
    "packaging",
    "importlib-metadata>=8.7.0",
]
build-backend = "salt_build_backend"
backend-path = ["tools/pkg"]

[project]
name = "salt"
description = "Portable, distributed, remote execution and configuration management system"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache Software License 2.0"}
authors = [
  {name = "Thomas S Hatch", email = "thatch45@gmail.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://saltproject.io"

[tool.black]
exclude= """
/(
    salt/ext
  | templates
)/
"""

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
skip="salt/ext,templates"
known_third_party = [
  "pytest"
]

[tool.ruff]
# Match the minimum Python version declared by this project.
target-version = "py38"
line-length = 88
extend-exclude = ["salt/ext", "templates"]
# Names Salt injects into modules at load time. Keep in sync with
# additional-builtins in .pylintrc.
builtins = [
    "__opts__",
    "__utils__",
    "__salt__",
    "__pillar__",
    "__grains__",
    "__context__",
    "__runner__",
    "__ret__",
    "__env__",
    "__low__",
    "__states__",
    "__lowstate__",
    "__running__",
    "__active_provider_name__",
    "__master_opts__",
    "__jid_event__",
    "__instance_id__",
    "__salt_system_encoding__",
    "__proxy__",
    "__serializers__",
    "__reg__",
    "__executors__",
    "__events__",
    "__resource_funcs__",
    "napalm_device",
]

[tool.ruff.lint]
# Only new violations block a PR (see tools/precommit/ruff.py), so a rule can be
# enabled while old code still breaks it. Black remains the formatter.
#
# Every stable rule is selected with "ALL" and the ones that are not enabled yet
# are listed in "ignore" below, in groups. To enable a rule, delete it from the
# list and add a case for it to tests/pytests/unit/test_ruff.py. Ruff is pinned in
# .pre-commit-config.yaml, so a new Ruff release does not add rules by itself.
select = ["ALL"]
ignore = [
    "F403",  # star imports
    "F405",  # names from star imports

    # Not enabled on purpose.
    # COM: conflicts with the formatter (trailing commas)
    # Q: conflicts with the formatter (quotes)
    # ISC: implicit string concatenation, formatter decides
    # D: docstring style, Salt has its own docstring checks
    # DOC: docstring contents, Salt has its own docstring checks
    # CPY: copyright header
    # FIX: FIXME and TODO markers
    # TD: TODO format
    # ERA: commented-out code
    # INP: implicit namespace packages
    # EM: error message in a variable
    # FBT: boolean positional arguments
    # T20: print and pprint
    # N: naming, renaming changes the public API
    # ARG: unused arguments, Salt functions have fixed signatures
    # E501: line length, black does not wrap long strings and comments
    # W191: conflicts with the formatter (tab indentation)
    # S101: assert, used throughout the tests
    # TRY003: long messages in exceptions
    # PLR2004: magic values
    # C901, PLR0911, PLR0912, PLR0913, PLR0915, PLR0917: complexity threshold
    # A002: parameter names that shadow builtins are part of the API
    "A002", "ARG", "C901", "COM", "CPY", "D", "E501", "EM", "ERA", "FBT", "FIX", "INP",
    "ISC", "N", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "Q",
    "S101", "TD", "TRY003", "W191",

    # Not decided yet.
    # ANN: type annotations
    # SLF001: private member access, mostly in tests
    # PT009: unittest style assertions in tests
    "ANN", "PT009", "SLF001",

    # Security rules (flake8-bandit), to be decided one by one. Bandit still runs.
    "S102", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112", "S113",
