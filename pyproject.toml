[build-system]
requires = [
    "setuptools>=64.0",
    "wheel",
    "looseversion",
    "packaging",
    "importlib-metadata>=8.7.0",
]
build-backend = "salt_build_backend"
backend-path = ["tools/pkg"]

[project]
name = "salt"
description = "Portable, distributed, remote execution and configuration management system"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache Software License 2.0"}
authors = [
  {name = "Thomas S Hatch", email = "thatch45@gmail.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://saltproject.io"

[tool.black]
exclude= """
/(
    salt/ext
  | templates
)/
"""

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
skip="salt/ext,templates"
known_third_party = [
  "pytest"
]

[tool.ruff]
# Salt 3008 runs on the Python 3.14 that it ships.
target-version = "py314"
line-length = 88
extend-exclude = ["salt/ext", "templates"]
# Names Salt injects into modules at load time. Keep in sync with
# additional-builtins in .pylintrc.
builtins = [
    "__opts__",
    "__utils__",
    "__salt__",
    "__pillar__",
    "__grains__",
    "__context__",
    "__runner__",
    "__ret__",
    "__env__",
    "__low__",
    "__states__",
    "__lowstate__",
    "__running__",
    "__active_provider_name__",
    "__master_opts__",
    "__jid_event__",
    "__instance_id__",
    "__salt_system_encoding__",
    "__proxy__",
    "__serializers__",
    "__reg__",
    "__executors__",
    "__events__",
    "__resource_funcs__",
    "napalm_device",
]

[tool.ruff.per-file-target-version]
# These files go into the salt-ssh thin and run on the Python of the target host.
"salt/client/ssh/ssh_py_shim.py" = "py37"
"salt/client/ssh/wrapper/pillar.py" = "py37"
"salt/utils/systemd.py" = "py37"

[tool.ruff.lint]
# Only new violations block a PR (see tools/precommit/ruff.py), so a rule can be
# enabled while old code still breaks it. Black remains the formatter.
#
# Every stable rule is selected with "ALL" and the ones that are not enabled yet
# are listed in "ignore" below, in groups. To enable a rule, delete it from the
# list and add a case for it to tests/pytests/unit/test_ruff.py. Ruff is pinned in
# .pre-commit-config.yaml, so a new Ruff release does not add rules by itself.
select = ["ALL"]
extend-select = [
    # Rules of the families that are not enabled (see ignore), which nothing in the code breaks.
    # A rule that is named here is enabled even if its family is in ignore.
    "COM819",  # prohibited-trailing-comma
    "D106",  # undocumented-public-nested-class
    "D201",  # blank-line-before-function
    "D204",  # incorrect-blank-line-after-class
    "D206",  # docstring-tab-indentation
    "D207",  # under-indentation
    "D210",  # surrounding-whitespace
    "D211",  # blank-line-before-class
    "D215",  # overindented-section-underline
    "D408",  # missing-section-underline-after-name
    "D418",  # overload-with-docstring
    "ISC002",  # multi-line-implicit-string-concatenation
    "N811",  # constant-imported-as-non-constant
    "N814",  # camelcase-imported-as-constant
    "Q001",  # bad-quotes-multiline-string
    "Q002",  # bad-quotes-docstring
    "Q003",  # avoidable-escaped-quote
    "Q004",  # unnecessary-escaped-quote
    "W191",  # tab-indentation
]
ignore = [
    "F403",  # star imports
    "F405",  # names from star imports

    # Not enabled on purpose. The rules of these families that nothing breaks are in
    # extend-select above.
    "A002",  # parameter names that shadow builtins are part of the API
    "ARG",  # unused arguments, Salt functions have fixed signatures
    "B008",  # calls in default arguments are how Salt sets its path defaults
    "C901",  # complexity threshold
    "COM",  # conflicts with the formatter (trailing commas)
    "CPY",  # copyright header
    "D",  # docstring style, Salt has its own docstring checks
    "E501",  # line length, black does not wrap long strings and comments
    "EM",  # error message in a variable
    "ERA",  # commented-out code
    "FBT",  # boolean positional arguments
    "FIX",  # FIXME and TODO markers
    "ICN001",  # import alias conventions are not part of the Salt style
    "ISC",  # implicit string concatenation, formatter decides
    "N",  # naming, renaming changes the public API
    "PLR0911",  # complexity threshold
    "PLR0912",  # complexity threshold
    "PLR0913",  # complexity threshold
    "PLR0915",  # complexity threshold
    "PLR0917",  # complexity threshold
    "PLR2004",  # magic values
    "PT015",  # "assert False" is allowed in tests, as for B011
    "Q",  # conflicts with the formatter (quotes)
    "RUF001",  # typographic characters and unicode test data
    "RUF002",  # typographic characters and unicode test data
    "RUF003",  # typographic characters and unicode test data
    "S101",  # assert, used throughout the tests
    "T201",  # print and pprint
    "T203",  # print and pprint
    "TC001",  # moving an import into a TYPE_CHECKING block breaks code that reads the annotations at run time
    "TC002",  # moving an import into a TYPE_CHECKING block breaks code that reads the annotations at run time
    "TD",  # TODO format
    "TRY003",  # long messages in exceptions

    # The fix is not a habit to change: it changes the behavior, or goes against the
    # way Salt is written.
    "ASYNC110",  # the fix is a change of the design (an Event, to_thread)
    "ASYNC240",  # the fix is a change of the design (an Event, to_thread)
    "E402",  # imports after sys.path or the environment are set, and the project turned wrong-import-position off in .pylintrc
    "G004",  # f-strings in logging are allowed (logging-fstring-interpolation is off in .pylintrc)
    "PLR2044",  # a line with only # separates the paragraphs of a comment
    "PLW2901",  # most of them are x = f(x) on the loop variable (line = line.strip())
    "RUF015",  # the fix turns the IndexError of an empty sequence into a StopIteration
    "SIM112",  # the Windows environment variables are written as Windows names them (SystemRoot, ProgramFiles)
    "SIM115",  # temporary files and tar files that stay open longer than one block
    "TRY004",  # a TypeError instead of the RuntimeError or ValueError that callers catch
    "TRY301",  # a raise in a try block that the same try catches

    # Report nothing without a setting, or cannot be triggered on their own.
    # They are to be enabled together with their setting.
    "E101",  # mixed-spaces-and-tabs
    "E902",  # io-error
    "I002",  # missing-required-import
    "ICN002",  # banned-import-alias
    "ICN003",  # banned-import-from
    "RUF200",  # invalid-pyproject-toml
    "TC007",  # unquoted-type-alias
    "TID251",  # banned-api
    "TID253",  # banned-module-level-imports
    "W505",  # doc-line-too-long

    # Not decided yet.
    "ANN",  # type annotations
    "DTZ001",  # call-datetime-without-tzinfo
    "DTZ002",  # call-datetime-today
    "DTZ005",  # call-datetime-now-without-tzinfo
    "DTZ006",  # call-datetime-fromtimestamp
    "DTZ007",  # call-datetime-strptime-without-zone
    "DTZ011",  # call-date-today
    "PT009",  # unittest style assertions in tests
    "PTH100",  # os-path-abspath
    "PTH101",  # os-chmod
    "PTH102",  # os-mkdir
    "PTH104",  # os-rename
    "PTH105",  # os-replace
    "PTH106",  # os-rmdir
    "PTH108",  # os-unlink
    "PTH109",  # os-getcwd
    "PTH114",  # os-path-islink
    "PTH117",  # os-path-isabs
    "PTH122",  # os-path-splitext
    "PTH123",  # builtin-open
    "PTH202",  # os-path-getsize
    "PTH204",  # os-path-getmtime
    "PTH207",  # glob
    "PTH211",  # os-symlink
    "PYI024",  # collections.namedtuple
    "SLF001",  # private member access, mostly in tests

    # Security rules (flake8-bandit), to be decided one by one. Bandit still runs.
    "S103",  # bad-file-permissions
    "S104",  # hardcoded-bind-all-interfaces
    "S105",  # hardcoded-password-string
    "S108",  # hardcoded-temp-file
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    "S303",  # suspicious-insecure-hash-usage
    "S306",  # suspicious-mktemp-usage
    "S307",  # suspicious-eval-usage
    "S310",  # suspicious-url-open-usage
    "S311",  # suspicious-non-cryptographic-random-usage
    "S314",  # suspicious-xml-element-tree-usage
    "S318",  # suspicious-xml-mini-dom-usage
    "S323",  # suspicious-unverified-context-usage
    "S324",  # hashlib-insecure-hash-function
    "S504",  # ssl-with-no-version
    "S506",  # unsafe-yaml-load
    "S507",  # ssh-no-host-key-verification
    "S603",  # subprocess-without-shell-equals-true
    "S604",  # call-with-shell-equals-true
    "S607",  # start-process-with-partial-path
    "S608",  # hardcoded-sql-expression
    "S701",  # jinja2-autoescape-false

    # Rules that depend on the Python version (3.14). The ones that nothing in the code
    # breaks are enabled. These are left: four that have nothing to report on 3.14, and
    # the ones with violations, to be decided one by one.
    "ASYNC109",  # async-function-with-timeout
    "B905",  # zip-without-explicit-strict
    "B912",  # map-without-explicit-strict
    "FA100",  # only reported for Python 3.8; nothing to report on 3.14
    "FA102",  # future-required-type-annotation
    "FAST001",  # does not report on the 3.14 version, and Salt does not use FastAPI
    "I001",  # unsorted-imports
    "PERF203",  # try-except-in-loop
    "PTH115",  # os-readlink
    "TC003",  # typing-only-standard-library-import
    "TC010",  # only reported up to Python 3.13; annotations are not evaluated at once on 3.14
    "UP007",  # non-pep604-annotation-union
    "UP010",  # unnecessary-future-import
    "UP013",  # convert-typed-dict-functional-to-class
    "UP015",  # redundant-open-modes
    "UP018",  # native-literals
    "UP022",  # replace-stdout-stderr
    "UP026",  # deprecated-mock-import
    "UP030",  # format-literals
    "UP031",  # printf-string-formatting
    "UP032",  # f-string
    "UP035",  # deprecated-import
    "UP036",  # outdated-version-block
    "UP037",  # quoted-annotation
    "UP042",  # replace-str-enum
    "UP047",  # non-pep695-generic-function

    # To be enabled last, when the set of rules is final. It reports the noqa comments
    # of rules that are not enabled yet, and asks to delete them.
    "RUF100",  # unused-noqa

    # Waiting for a decision or for another change:
    "BLE001",  # pylint reports the same, to be moved with it
    "RUF059",  # little value
    "TRY400",  # logging.exception adds a traceback to the logs

    # Only a way of writing, nothing that goes wrong without it. Not worth the
    # change of the line.
    "C408",  # unnecessary-collection-call
    "FLY002",  # static-join-to-f-string
    "PERF401",  # manual-list-comprehension
    "PLC0415",  # import-outside-top-level
    "PLR0402",  # manual-from-import
    "PLR5501",  # collapsible-else-if
    "PLW0603",  # global-statement
    "PT006",  # pytest-parametrize-names-wrong-type
    "PT007",  # pytest-parametrize-values-wrong-type
    "PT019",  # pytest-fixture-param-without-value
    "PT022",  # pytest-useless-yield-fixture
    "PT027",  # pytest-unittest-raises-assertion
    "PTH103",  # os-makedirs
    "PTH107",  # os-remove
    "PTH110",  # os-path-exists
    "PTH111",  # os-path-expanduser
    "PTH112",  # os-path-isdir
    "PTH113",  # os-path-isfile
    "PTH116",  # os-stat
    "PTH118",  # os-path-join
    "PTH119",  # os-path-basename
    "PTH120",  # os-path-dirname
    "PTH208",  # os-listdir
    "RET504",  # unnecessary-assign
    "RET505",  # superfluous-else-return
    "RET506",  # superfluous-else-raise
    "RUF005",  # collection-literal-concatenation
