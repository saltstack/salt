[build-system]
requires = [
    "setuptools>=64.0",
    "wheel",
    "looseversion",
    "packaging",
    "importlib-metadata>=8.7.0",
]
build-backend = "salt_build_backend"
backend-path = ["tools/pkg"]

[project]
name = "salt"
description = "Portable, distributed, remote execution and configuration management system"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache Software License 2.0"}
authors = [
  {name = "Thomas S Hatch", email = "thatch45@gmail.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://saltproject.io"

[tool.black]
exclude= """
/(
    salt/ext
  | templates
)/
"""

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
skip="salt/ext,templates"
known_third_party = [
  "pytest"
]

[tool.ruff]
# Match the minimum Python version declared by this project.
target-version = "py38"
line-length = 88
extend-exclude = ["salt/ext", "templates"]
# Names Salt injects into modules at load time. Keep in sync with
# additional-builtins in .pylintrc.
builtins = [
    "__opts__",
    "__utils__",
    "__salt__",
    "__pillar__",
    "__grains__",
    "__context__",
    "__runner__",
    "__ret__",
    "__env__",
    "__low__",
    "__states__",
    "__lowstate__",
    "__running__",
    "__active_provider_name__",
    "__master_opts__",
    "__jid_event__",
    "__instance_id__",
    "__salt_system_encoding__",
    "__proxy__",
    "__serializers__",
    "__reg__",
    "__executors__",
    "__events__",
    "__resource_funcs__",
    "napalm_device",
]

[tool.ruff.lint]
# Only new violations block a PR (see tools/precommit/ruff.py), so a rule can be
# enabled while old code still breaks it. Black remains the formatter.
#
# Every stable rule is selected with "ALL" and the ones that are not enabled yet
# are listed in "ignore" below, in groups. To enable a rule, delete it from the
# list and add a case for it to tests/pytests/unit/test_ruff.py. Ruff is pinned in
# .pre-commit-config.yaml, so a new Ruff release does not add rules by itself.
select = ["ALL"]
ignore = [
    "F403",  # star imports
    "F405",  # names from star imports

    # Not enabled on purpose.
    # COM: conflicts with the formatter (trailing commas)
    # Q: conflicts with the formatter (quotes)
    # ISC: implicit string concatenation, formatter decides
    # D: docstring style, Salt has its own docstring checks
    # DOC: docstring contents, Salt has its own docstring checks
    # CPY: copyright header
    # FIX: FIXME and TODO markers
    # TD: TODO format
    # ERA: commented-out code
    # INP: implicit namespace packages
    # EM: error message in a variable
    # FBT: boolean positional arguments
    # T20: print and pprint
    # N: naming, renaming changes the public API
    # ARG: unused arguments, Salt functions have fixed signatures
    # E501: line length, black does not wrap long strings and comments
    # W191: conflicts with the formatter (tab indentation)
    # S101: assert, used throughout the tests
    # TRY003: long messages in exceptions
    # PLR2004: magic values
    # C901, PLR0911, PLR0912, PLR0913, PLR0915, PLR0917: complexity threshold
    # A002: parameter names that shadow builtins are part of the API
    # TC001, TC002: moving an import into a TYPE_CHECKING block breaks code that reads
    # the annotations at run time
    # ICN001: import alias conventions are not part of the Salt style
    # B008: calls in default arguments are how Salt sets its path defaults
    # PT015: "assert False" is allowed in tests, as for B011
    # RUF001, RUF002, RUF003: typographic characters and unicode test data
    "A002", "ARG", "B008", "C901", "COM", "CPY", "D", "E501", "EM", "ERA", "FBT", "FIX",
    "ICN001", "INP", "ISC", "N", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PLR2004", "PT015", "Q", "RUF001", "RUF002", "RUF003", "S101", "T201", "T203",
    "TC001", "TC002", "TD", "TRY003", "W191",

    # The fix is not a habit to change: it changes the behavior, or goes against the
    # way Salt is written.
    # G004: f-strings in logging are allowed (logging-fstring-interpolation is off in .pylintrc)
    # SIM112: the Windows environment variables are written as Windows names them
    # (SystemRoot, ProgramFiles)
    # SIM115: temporary files and tar files that stay open longer than one block
    # TRY004: a TypeError instead of the RuntimeError or ValueError that callers catch
    # TRY301: a raise in a try block that the same try catches
    "G004", "SIM112", "SIM115", "TRY004", "TRY301",

    # Rules for libraries and file types that Salt does not use: Airflow, Django,
    # FastAPI, gettext, NumPy, pandas, and the type stubs (.pyi) rules.
    "AIR001", "AIR002", "AIR301", "AIR302", "AIR303", "AIR311", "AIR312", "DJ001",
    "DJ003", "DJ006", "DJ007", "DJ008", "DJ012", "DJ013", "FAST001", "FAST002",
    "FAST003", "INT001", "INT002", "INT003", "NPY001", "NPY002", "NPY003", "NPY201",
    "PD002", "PD003", "PD004", "PD007", "PD008", "PD009", "PD010", "PD011", "PD012",
    "PD013", "PD015", "PD101", "PYI001", "PYI002", "PYI003", "PYI004", "PYI005",
    "PYI007", "PYI008", "PYI009", "PYI010", "PYI011", "PYI012", "PYI013", "PYI014",
    "PYI015", "PYI016", "PYI017", "PYI018", "PYI019", "PYI020", "PYI021", "PYI026",
    "PYI029", "PYI030", "PYI032", "PYI033", "PYI035", "PYI041", "PYI042", "PYI043",
    "PYI044", "PYI045", "PYI046", "PYI047", "PYI048", "PYI049", "PYI050", "PYI051",
    "PYI052", "PYI053", "PYI054", "PYI055", "PYI056", "PYI057", "PYI058", "PYI059",
    "PYI061", "PYI062", "PYI063", "PYI064", "PYI066",

    # Report nothing without a setting, or cannot be triggered on their own.
    # They are to be enabled together with their setting.
    "E101", "E902", "I002", "ICN002", "ICN003", "RUF200", "TC007", "TID251", "TID253",
    "W505",

    # Not decided yet.
    # ANN: type annotations
    # SLF001: private member access, mostly in tests
    # PT009: unittest style assertions in tests
    # DTZ: naive datetimes, making them aware changes the behavior
    # PTH: pathlib
    # PYI024: collections.namedtuple
    "ANN", "DTZ001", "DTZ002", "DTZ005", "DTZ006", "DTZ007", "DTZ011", "PT009",
    "PTH100", "PTH101", "PTH102", "PTH104", "PTH105", "PTH106", "PTH108", "PTH109",
    "PTH114", "PTH117", "PTH122", "PTH123", "PTH202", "PTH204", "PTH207", "PTH211",
    "PYI024", "SLF001",

    # Security rules (flake8-bandit), to be decided one by one. Bandit still runs.
    "S102", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112", "S113",
    "S201", "S202", "S301", "S303", "S306", "S307", "S308", "S310", "S311", "S314",
    "S318", "S321", "S323", "S324", "S504", "S506", "S507", "S508", "S509", "S602",
    "S603", "S604", "S605", "S607", "S608", "S610", "S611", "S701", "S702",

    # Result depends on the Python version Ruff checks for, to be enabled after the
    # minimum Python version is raised.
    "ASYNC109", "B905", "B911", "B912", "FA102", "FURB161", "FURB162", "FURB188",
    "I001", "PERF203", "PTH115", "RUF007", "RUF053", "TC003", "UP001", "UP003", "UP004",
    "UP005", "UP006", "UP007", "UP008", "UP009", "UP010", "UP011", "UP012", "UP013",
    "UP014", "UP015", "UP017", "UP018", "UP019", "UP020", "UP021", "UP022", "UP023",
    "UP024", "UP025", "UP026", "UP028", "UP029", "UP030", "UP031", "UP032", "UP033",
    "UP034", "UP035", "UP036", "UP037", "UP039", "UP040", "UP041", "UP042", "UP043",
    "UP044", "UP045", "UP046", "UP047", "UP049", "UP050",

    # To be enabled last, when the set of rules is final. It reports the noqa comments
    # of rules that are not enabled yet, and asks to delete them.
    "RUF100",

    # Waiting for a decision or for another change:
    # BLE001: pylint reports the same, to be moved with it
    # TRY400: logging.exception adds a traceback to the logs
    # RUF059: little value
    "BLE001", "RUF059", "TRY400",

    # Only a way of writing, nothing that goes wrong without it. Not worth the
    # change of the line.
    "C408", "FLY002", "PERF401", "PLC0415", "PLR0402", "PLR5501", "PLW0603", "PT006",
    "PT007", "PT019", "PT022", "PT027", "PTH103", "PTH107", "PTH110", "PTH111",
    "PTH112", "PTH113", "PTH116", "PTH118", "PTH119", "PTH120", "PTH208", "RET504",
    "RET505", "RET506", "RUF005", "RUF019", "RUF061", "SIM102", "SIM103", "SIM105",
    "SIM108", "SIM114", "SIM117", "SIM300", "TRY300", "TRY401",
]

[tool.ruff.lint.per-file-ignores]
# Unused local variables are not checked in tests for now.
# "assert False" is allowed in tests: with "python -O" every assert in the test
# suite is removed, so replacing this one would not protect anything.
"tests/**" = ["F841", "B011"]

[tool.towncrier]
    package = "salt"
    filename = "CHANGELOG.md"
    directory = "changelog/"
    template = "changelog/.template.jinja"
    start_string = "# Changelog\n"
    underlines = ["", "", ""]
    title_format = "## {version} ({project_date})"
    issue_format = "[#{issue}](https://github.com/saltstack/salt/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "removed"
        name = "Removed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecated"
        name = "Deprecated"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "changed"
        name = "Changed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "fixed"
        name = "Fixed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "added"
        name = "Added"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "security"
        name = "Security"
        showcontent = true
