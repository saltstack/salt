[tool.ruff.lint.per-file-ignores]
# Unused local variables are not checked in tests for now.
# "assert False" is allowed in tests: with "python -O" every assert in the test
# suite is removed, so replacing this one would not protect anything.
# S602, S301 and S106 are for the code that handles data from outside. The tests run
# commands they wrote themselves, unpickle what they pickled and use made-up passwords.
# The directories of the tests and the scripts are not packages (INP001).
"tests/**" = ["F841", "B011", "S106", "S301", "S602", "INP001"]
"tools/**" = ["INP001"]
".github/**" = ["INP001"]

[tool.towncrier]
    package = "salt"
    filename = "CHANGELOG.md"
    directory = "changelog/"
    template = "changelog/.template.jinja"
    start_string = "# Changelog\n"
    underlines = ["", "", ""]
    title_format = "## {version} ({project_date})"
    issue_format = "[#{issue}](https://github.com/saltstack/salt/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "removed"
        name = "Removed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecated"
        name = "Deprecated"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "changed"
        name = "Changed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "fixed"
        name = "Fixed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "added"
        name = "Added"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "security"
        name = "Security"
        showcontent = true
