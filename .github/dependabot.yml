version: 2
updates:
  # master: full version + security updates, grouped weekly
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements/static/ci"
      - "/requirements/static/pkg"
    schedule:
      interval: "weekly"
    target-branch: master
    labels:
      - "test:full"
    open-pull-requests-limit: 5
    # Deliberately held caps. These exist because the pin comments in
    # requirements/constraints.txt, requirements/pytest.txt, and
    # requirements/static/ci/lint.txt document concrete breakage at the
    # next major (onedir build / cpython 3.14 venv corruption / lint
    # false-positives / factory compat). Dependabot does not read those
    # comments, so we must gate each one here.
    #   vcert 0.18+ hard-pins pynacl/cryptography/six against the rest of CI
    #   pylint >= 3.2 adds default-on E0601/E0602/E0606; audit pending
    #   pytest >= 9 needs pytest-salt-factories compat review
    #   pip >= 26 ships a vendored pygments missing modeline on cpython 3.14
    #   setuptools-scm >= 10 splits version inference, breaks --no-binary=:all:
    # Each cap is duplicated with applies-to: security-updates because ignore
    # entries default to version-updates only; without the duplicate,
    # dependabot opens security PRs that jump past the cap (precedent: #70944
    # proposed pip 25.2 -> 26.2 to clear six open pip CVEs at once).
    ignore:
      - dependency-name: "vcert"
        versions: [">=0.10.0"]
      - dependency-name: "vcert"
        versions: [">=0.10.0"]
        applies-to: security-updates
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
        applies-to: security-updates
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
        applies-to: security-updates
      - dependency-name: "pip"
        versions: [">=26.0.0"]
      - dependency-name: "pip"
        versions: [">=26.0.0"]
        applies-to: security-updates
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
        applies-to: security-updates
    groups:
      all-pip-updates:
        patterns:
          - "*"

  # 3008.x: security advisories only. open-pull-requests-limit: 0 disables
  # version-update PRs; security-update PRs still fire on GHSA advisories.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements/static/ci"
      - "/requirements/static/pkg"
    schedule:
      interval: "weekly"
    target-branch: 3008.x
    labels:
      - "test:full"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "vcert"
        versions: [">=0.10.0"]
      - dependency-name: "vcert"
        versions: [">=0.10.0"]
        applies-to: security-updates
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
        applies-to: security-updates
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
        applies-to: security-updates
      - dependency-name: "pip"
        versions: [">=26.0.0"]
      - dependency-name: "pip"
        versions: [">=26.0.0"]
        applies-to: security-updates
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
        applies-to: security-updates

  # 3007.x: security advisories only.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements/static/ci"
      - "/requirements/static/pkg"
    schedule:
      interval: "weekly"
    target-branch: 3007.x
    labels:
      - "test:full"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "vcert"
