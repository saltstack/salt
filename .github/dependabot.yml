      - dependency-name: "vcert"
        versions: [">=0.10.0"]
        applies-to: security-updates
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
      - dependency-name: "pylint"
        versions: [">=3.2.0"]
        applies-to: security-updates
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
        applies-to: security-updates
      - dependency-name: "pip"
        versions: [">=26.0.0"]
      - dependency-name: "pip"
        versions: [">=26.0.0"]
        applies-to: security-updates
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
      - dependency-name: "setuptools-scm"
        versions: [">=10.0.0"]
        applies-to: security-updates

  # 3006.x: security advisories only.
  - package-ecosystem: "pip"
    directories:
