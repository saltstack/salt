name: Nightly Stress Test Dispatch

# GitHub Actions only registers a workflow's `schedule:` trigger off the
# repository's default branch (master) -- nightly-stress-test.yml is now a
# plain single-branch-input workflow with no `schedule:` trigger of its own,
# so this is the only thing that fires it nightly. On cron, dispatches it
# once per branch in the nightly set (via workflow_dispatch, --ref master so
# every dispatch loads the same simple job definition, with inputs.branch
# picking the actual code under test) -- three separate, independent
# workflow runs, not matrix legs sharing one run.
#
# 3007.x is deliberately left out of the nightly set -- its
# tests/monitoring/ predates render_panels.py, so the Render Dashboard
# Panels / Publish panels / Panel Summary steps in nightly-stress-test.yml
# would fail against it as-is.
on:
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger nightly-stress-test.yml for master, 3008.x, 3006.x
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for branch in master 3008.x 3006.x; do
            gh workflow run nightly-stress-test.yml \
              --repo "${{ github.repository }}" \
              --ref master \
              -f branch="$branch" \
              -f duration=30m
          done
