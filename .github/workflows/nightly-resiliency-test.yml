name: Nightly Resiliency Test

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC (offset from nightly-stress-test.yml's 2 AM)
  workflow_dispatch:
    inputs:
      topology:
        description: Resiliency topology to exercise (``all`` expands the matrix)
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'single'
          - 'cluster3'
          - 'cluster5'
          - 'multimaster-failover'
          - 'multimaster-hothot'
          - 'syndic'
      duration:
        description: Workload duration (not total runtime; ``timeout 1h`` caps the orchestrator)
        required: true
        default: '0.5h'
        type: choice
        options:
          - '10m'
          - '0.5h'
          - '1h'
          - '1.5h'
          - '2h'
      scenarios:
        description: Space-separated subset of all scenarios (default = full battery)
        required: false
        default: 'baseline master_restart network_faults minion_churn signal_pause resource_pressure disk_faults clock_skew salt_ops netem_advanced fileserver_orch cluster_faults master_marathon'
        type: string
      marathon_enabled:
        description: Run master_marathon phases (30m + 60m + 2h master outages). Defaults ON for nightly; flip to false for a fast dispatch.
        required: false
        default: true
        type: boolean

jobs:
  resolve-matrix:
    # ``all`` fan-out: expand the single workflow_dispatch input (or the
    # schedule default) into the four-topology matrix consumed by
    # ``resiliency-test``.  Scheduled runs always expand to ``all``; a
    # single-topology dispatch produces a 1-entry matrix.
    runs-on: ubuntu-latest
    if: vars.SKIP_NIGHTLY_RESILIENCY_TEST != 'true'
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - id: pick
        env:
          INPUT_TOPOLOGY: ${{ github.event.inputs.topology || 'all' }}
        run: |
          # Matrix is (topology, group) tuples instead of a flat topology
          # list.  Two groups split the ~4h50m full suite into windows
          # that fit the 5h GHA ceiling with margin:
          #
          #   fast     -- all scenarios except master_marathon, with
          #               @pytest.mark.extended tests gated off.  ~30-40m
          #               per topology.  Runs on every topology (6 jobs).
          #
          #   marathon -- master_marathon scenario only, with --marathon
          #               enabled.  ~4h per topology because of the
          #               outage_120m phase alone.  Runs only on topologies
          #               where long-outage behavior is informative:
          #                 single               -- canonical outage test
          #                 multimaster-failover -- failover under long outage
          #                 syndic               -- MOM/SUB long-outage ground
          #               cluster3/cluster5 get their quorum coverage from
          #               cluster_split_brain_simulate in the fast group;
          #               multimaster-hothot shares its code paths with
          #               multimaster-failover for the marathon purpose.
          #
          # 9 jobs total.  Each stays under the empirically observed 5h
          # effective GHA ceiling.
          case "$INPUT_TOPOLOGY" in
            all)
              jobs='['
              jobs+='{"topology":"single","group":"fast"},'
              jobs+='{"topology":"cluster3","group":"fast"},'
              jobs+='{"topology":"cluster5","group":"fast"},'
              jobs+='{"topology":"multimaster-failover","group":"fast"},'
              jobs+='{"topology":"multimaster-hothot","group":"fast"},'
              jobs+='{"topology":"syndic","group":"fast"},'
              jobs+='{"topology":"single","group":"marathon"},'
              jobs+='{"topology":"multimaster-failover","group":"marathon"},'
              jobs+='{"topology":"syndic","group":"marathon"}'
              jobs+=']'
              echo "jobs=${jobs}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Single-topology dispatch always runs fast + marathon both
              # (same logic as before: everything the user explicitly
              # selected).  If only one group is wanted, dispatch via the
              # topology input twice with different ``scenarios``.
              echo "jobs=[{\"topology\":\"$INPUT_TOPOLOGY\",\"group\":\"fast\"},{\"topology\":\"$INPUT_TOPOLOGY\",\"group\":\"marathon\"}]" >> "$GITHUB_OUTPUT"
              ;;
          esac

  resiliency-test:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    # Repo-level opt-out, mirrors nightly-stress-test.yml.  Set
    # ``SKIP_NIGHTLY_RESILIENCY_TEST=true`` on repos where this shouldn't
    # run (e.g. saltstack/salt -- resiliency CI cost belongs on the
    # salt-nightlies fork).
    if: vars.SKIP_NIGHTLY_RESILIENCY_TEST != 'true'
    # ``contents: write`` lets the ``Publish panels to
    # resiliency-snapshots branch`` step push rendered PNGs to an orphan
    # branch so the step summary can embed them via
    # raw.githubusercontent.com URLs.
    permissions:
      contents: write
    strategy:
      # Don't let one flaky topology-group cancel the others -- each is
      # an independent diagnostic.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.jobs) }}
    env:
      # multimaster compose stacks publish prometheus on :19091 instead
      # of the :19090 the single/cluster3 stacks use.  The analyzer,
      # render_panels.py (via PROM_URL), and the standalone ``Analyze
      # Results`` step all read this value, so centralize it here.
      PROM_PORT: ${{ (startsWith(matrix.topology, 'multimaster') && '19091') || (matrix.topology == 'syndic' && '19092') || (matrix.topology == 'cluster5' && '19093') || '19090' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.topology }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.topology }}-
            ${{ runner.os }}-buildx-

      - name: Prepare prometheus_data dir
        # prometheus runs as nobody (uid 65534) and writes /prometheus;
        # without pre-creating the bind-mount source with that ownership
        # docker auto-creates it root-owned and prometheus fails with
        # "permission denied", surfacing downstream as a bare
        # ConnectionRefusedError against the analyzer URL.  Same pattern
        # as nightly-stress-test.yml's "Build and Start Environment"
        # step, but the path varies per topology so switch on it here.
        #
        # cluster3 + cluster5 are the two overlay-merged topologies:
        # their base compose lives under tests/monitoring/, but the
        # monitoring-overlay.yml (which adds the prometheus service)
        # bind-mounts the prometheus_data directory from
        # tests/resiliency/compose/cluster{3,5}/prometheus_data.  Chowning
        # the base-compose path (tests/monitoring/cluster-3node/...) was
        # a no-op: docker auto-created the real overlay path root-owned
        # and prometheus restart-looped the entire run (see the 362
        # "Starting Prometheus Server" entries in cluster5's sidecar log
        # on run 43773954141).  Point PROM_DATA_DIR at the path the
        # overlay actually binds.
        run: |
          case "${{ matrix.topology }}" in
            single)
              PROM_DATA_DIR=tests/resiliency/compose/single/prometheus_data
              ;;
            cluster3)
              PROM_DATA_DIR=tests/resiliency/compose/cluster3/prometheus_data
              ;;
            cluster5)
              PROM_DATA_DIR=tests/resiliency/compose/cluster5/prometheus_data
              ;;
            multimaster-failover|multimaster-hothot)
              PROM_DATA_DIR=tests/resiliency/compose/multimaster/prometheus_data
              ;;
            syndic)
              PROM_DATA_DIR=tests/resiliency/compose/syndic/prometheus_data
              ;;
            *)
              echo "unknown topology: ${{ matrix.topology }}" >&2
              exit 2
              ;;
          esac
          echo "PROM_DATA_DIR=${PROM_DATA_DIR}" >> "$GITHUB_ENV"
          mkdir -p "$PROM_DATA_DIR"
          sudo chown -R 65534:65534 "$PROM_DATA_DIR"

      - name: Set up Python
        # Same pattern as .github/workflows/doc-linkcheck.yml.  The
        # resiliency wrapper (run_resiliency.sh) auto-picks ``pytest``
        # from $PATH; setup-python puts the pinned interpreter on PATH.
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/static/ci/py3.14/linux.lock

      - name: Install test dependencies
        # Reuse the project's existing locked Linux test-env list so
        # pytest + its transitive deps match the versions the main CI
        # resolves.  The wrapper's ``-p no:system-statistics -p
        # no:salt-factories`` flags disable the plugins from this lock
        # that would double-register with the resiliency suite's own
        # fixtures.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/static/ci/py3.14/linux.lock

      - name: Disk preflight
        # ubuntu-latest ships with ~14 GB free on /, which 5h of debug-
        # logged masters + buildx cache + docker image layers + per-test
        # workload logs can absolutely exhaust -- see run
        # 43773954141/job/132995852482 (cluster3), hard-killed at ~2h54m
        # by ``No space left on device`` writing the runner's own
        # ``_diag/Worker_*.log``.  Log the pre-run size so the next
        # exhaustion has a baseline, and log the post-run size in
        # Collect Logs so we can see how fast the budget drained.
        if: always()
        run: |
          df -h / /tmp 2>&1 || true
          echo "docker images:"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' 2>&1 | head -20 || true

      - name: Start disk trace (background)
        # Continuous disk-usage trace to catch disk-exhaustion crashes
        # where the GHA worker dies before any ``if: always()`` /
        # ``if: failure()`` step can run (precedent: runs 43773954141 +
        # 43824366115 cluster3 -- step conclusion=null, logs blob 404,
        # no Collect Logs output).  Host-side bash loop setsid'd +
        # disown'd: cheap, sees the runner-local /tmp + _diag paths,
        # dies if the worker dies hard but survives orderly ``timeout``
        # kills.
        #
        # An earlier revision also started an alpine ``--pid=host``
        # helper container running the same ``du -sh`` against
        # ``/var/lib/docker``; both loops at 60s intervals were enough
        # I/O load (cluster5 masters produce GB-scale json.log under
        # the Errno-22 traceback storm) to starve the GHA worker's
        # heartbeat -- run 43948880627/job/133585824042 was cancelled
        # at 1h25m with "hosted runner lost communication".  Now a
        # single lightweight host loop using ``stat``/``df``/``ls``
        # instead of recursive ``du`` scans, at 180s cadence (~30
        # samples per 90-min window).
        #
        # Writes to ${GITHUB_WORKSPACE}/artifacts/disk-trace/, which
        # the Upload Artifacts step bundles into
        # resiliency-<topo>-<run>/artifacts/disk-trace/ IF the worker
        # survives.  If it doesn't, the trace at least lives on the
        # ephemeral runner until GHA reaps it -- better than the current
        # zero-data state.
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/disk-trace"
          chmod 0777 "${GITHUB_WORKSPACE}/artifacts/disk-trace"

          # Host-side logger.  setsid detaches from the step's process
          # group so when GHA kills the step the loop keeps going; the
          # Stop disk trace step (if it runs) cleans it up via pidfile.
          # All size reads are O(1) (``df`` reads the FS block header,
          # ``stat`` reads the inode, ``ls`` uses readdir+stat) -- no
          # ``du -sh`` anywhere, so container-log growth to GB scale
          # doesn't translate into recursive-scan I/O load.
          cat > "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.sh" <<'LOGGER'
          #!/bin/bash
          out="${GITHUB_WORKSPACE}/artifacts/disk-trace"
          mkdir -p "$out"
          while :; do
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              {
                  echo "=== $ts df -h / /tmp /var/lib/docker ==="
                  df -h / /tmp /var/lib/docker 2>&1
                  echo
                  echo "=== docker ps --size (daemon API, not FS scan) ==="
                  docker ps --size --format 'table {{.Names}}\t{{.Status}}\t{{.Size}}' 2>&1 | head -30
                  echo
                  echo "=== top-20 compose container json.log sizes (stat, bytes) ==="
                  sudo stat --printf='%s %n\n' /var/lib/docker/containers/*/*-json.log 2>/dev/null \
                      | sort -rn | head -20
                  echo
                  echo "=== /tmp top-level entries (ls, no recursion) ==="
                  ls -la /tmp 2>/dev/null | head -20
                  echo
                  echo "=== runner _diag worker log sizes (precedent crash site) ==="
                  sudo ls -la /home/runner/runners/*/_diag/ 2>/dev/null | tail -20
              } >> "$out/host-trace.log" 2>&1
              sleep 180
          done
          LOGGER
          chmod +x "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.sh"
          setsid "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.sh" \
              < /dev/null > /dev/null 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.pid"
          disown || true
          echo "host-logger started pid=$(cat "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.pid")"

      - name: Start environment
        # Hand off to the resiliency orchestrator.  ``timeout`` is
        # applied here (not inside the script) so a wedged topology --
        # setsid workload stuck in a zombie wait, a hung
        # ``docker compose up``, prometheus failing to report ready --
        # can't eat the full 6h runner budget.  The workload DURATION is
        # a knob inside the orchestrator.  Normal runs use 1h; a
        # marathon-enabled run expands to 5h (120m phase alone is 2h)
        # and 120m-enabled to 6h (hard GHA ceiling).
        id: start-env
        env:
          GROUP: ${{ matrix.group }}
        run: |
          # Stamp the run-start timestamp BEFORE the long orchestrator
          # invocation so the render + summary steps can thread it into
          # the per-PNG suptitle + the step-summary header.  Captured
          # once here (not re-computed later) so retries / cache hits
          # don't drift and every panel + summary references the same
          # moment the compose stack went up.
          run_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "run-started-at=${run_started_at}" >> "$GITHUB_OUTPUT"
          echo "Resiliency run start stamp: ${run_started_at}"
          cd tests/resiliency
          # Group-specific knobs.  The matrix dimension ``group`` picks:
          #
          #   fast     -- every non-marathon scenario, marathon markers
          #               off, extended markers off.  ~30-45m per
          #               topology, 4h outer timeout.
          #   marathon -- master_marathon scenario only, --marathon on.
          #               ~4h30m per topology (120m phase dominates),
          #               5h outer timeout.  Runs only on topologies
          #               where long-outage behavior is informative
          #               (see resolve-matrix).
          case "$GROUP" in
            marathon)
              outer_timeout=5h
              marathon_enabled=1
              scenarios="master_marathon"
              extra_pytest=""
              ;;
            fast|*)
              outer_timeout=4h
              marathon_enabled=0
              scenarios="baseline master_restart network_faults minion_churn signal_pause resource_pressure disk_faults clock_skew salt_ops netem_advanced fileserver_orch cluster_faults"
              extra_pytest=""
              ;;
          esac
          echo "Group ${GROUP}: outer_timeout=${outer_timeout} marathon=${marathon_enabled}"
          # Dispatch overrides still win: explicit scenarios/marathon_enabled
          # from workflow_dispatch inputs take precedence over the group's
          # derived defaults.  Schedule events have empty inputs so
          # fall through to the group derivation.
          user_scenarios="${{ github.event.inputs.scenarios || '' }}"
          [ -n "$user_scenarios" ] && scenarios="$user_scenarios"
          user_marathon="${{ github.event.inputs.marathon_enabled || '' }}"
          if [ "$user_marathon" = "true" ]; then
            marathon_enabled=1
          elif [ "$user_marathon" = "false" ]; then
            marathon_enabled=0
          fi
          # ``--no-cleanup`` keeps the compose stack (and prometheus)
          # running after pytest exits so the follow-on workflow steps
          # ``Analyze Results`` + ``Render Dashboard Panels`` can
          # still query http://127.0.0.1:${PROM_PORT}.
          timeout "$outer_timeout" env \
            TOPOLOGY=${{ matrix.topology }} \
            DURATION=${{ github.event.inputs.duration || '0.5h' }} \
            SCENARIOS="$scenarios" \
            PROMETHEUS_URL="http://127.0.0.1:${PROM_PORT}" \
            MARATHON_ENABLED="$marathon_enabled" \
            PYTEST_EXTRA_ARGS="--no-cleanup $extra_pytest" \
            ./run_resiliency.sh

      - name: Stop disk trace
        # Best-effort shutdown of the background disk logger started
        # before Start environment.  Never fail the job -- the loop
        # self-terminates when the runner is reaped; stopping it here
        # just prevents a stray orphan between back-to-back matrix jobs
        # on long-lived runners (not strictly needed on hosted
        # ubuntu-latest, kept for symmetry).
        if: always()
        run: |
          pidfile="${GITHUB_WORKSPACE}/artifacts/disk-trace/host-logger.pid"
          if [ -f "$pidfile" ]; then
              pid=$(cat "$pidfile" 2>/dev/null || echo "")
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                  kill -TERM "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
              fi
          fi
          # Final sample so the trace file has a known terminal entry
          # even if the workload step hard-killed the periodic loop.
          # Same O(1) commands as the periodic sampler -- no ``du -sh``.
          {
              echo "=== FINAL $(date -u +%Y%m%dT%H%M%SZ) ==="
              df -h / /tmp /var/lib/docker 2>&1
              docker ps --size --format 'table {{.Names}}\t{{.Status}}\t{{.Size}}' 2>&1 | head -30
              echo "--- top-20 container json.log sizes (stat, bytes) ---"
              sudo stat --printf='%s %n\n' /var/lib/docker/containers/*/*-json.log 2>/dev/null \
                  | sort -rn | head -20
          } >> "${GITHUB_WORKSPACE}/artifacts/disk-trace/host-trace.log" 2>&1 || true

      - name: Analyze Results
        # The orchestrator already invokes analyze_resiliency.py and
        # exits with its return code, but a ``timeout`` or a trapped
        # EXIT handler can swallow the real verdict.  Re-run the
        # analyzer here against the most-recent results.jsonl so the
        # job's exit code is an idempotent check and the step logs
        # carry the verdict table independently.
        if: always()
        run: |
          # Pick the newest results dir written by this run.  The
          # orchestrator writes results/<utc-timestamp>/results.jsonl
          # where ``utc-timestamp`` is ``YYYYMMDDTHHMMSSZ`` — strictly
          # lexically sortable, so ``sort | tail -1`` is equivalent
          # to an mtime-sort without triggering shellcheck SC2012.
          results_file=$(find tests/resiliency/results -mindepth 2 -maxdepth 2 \
                             -name results.jsonl 2>/dev/null \
                         | sort | tail -1)
          if [ -z "$results_file" ]; then
            echo "no results.jsonl found -- orchestrator likely never reached analyze step"
            exit 0
          fi
          python3 tests/resiliency/analyze_resiliency.py \
            --results "$results_file" \
            --topology "${{ matrix.topology }}" \
            --prometheus-url "http://127.0.0.1:${PROM_PORT}" \
            --ci

      - name: Render Dashboard Panels
        # Render BEFORE Snapshot Metrics stops prometheus so the range
        # queries still return data.  render_panels.py reads PROM_URL
        # (not PROMETHEUS_URL) from the environment, so pass it through
        # explicitly; multimaster swaps :19090 for :19091.
        # Mirrors nightly-stress-test.yml's render step.
        #
        # ``RESILIENCY_PANEL_*`` envs stamp each PNG with a
        # ``<topology> / run <id> / <sha[:12]> / started <iso>`` suptitle
        # so a panel downloaded from an artifact bundle or copied out of
        # the ``resiliency-snapshots`` branch still identifies which
        # Actions run produced it.  Fallback to current UTC inside the
        # script if ``RESILIENCY_PANEL_STARTED_AT`` is empty, but we
        # pass the ``start-env`` step output so every panel references
        # the same stamp the Panel Summary step uses.
        if: always()
        env:
          RESILIENCY_PANEL_TOPOLOGY: ${{ matrix.topology }}-${{ matrix.group }}
          RESILIENCY_PANEL_RUN_ID: ${{ github.run_id }}
          RESILIENCY_PANEL_SHA: ${{ github.sha }}
          RESILIENCY_PANEL_STARTED_AT: ${{ steps.start-env.outputs.run-started-at }}
        run: |
          python3 -m pip install --quiet matplotlib
          PANELS_DIR="${GITHUB_WORKSPACE}/artifacts/panels" \
          PROM_URL="http://127.0.0.1:${PROM_PORT}" \
            python3 tests/monitoring/render_panels.py

      - name: Snapshot Metrics
        if: always()
        run: |
          # Stop prometheus to ensure the TSDB WAL is flushed before we
          # tar the data directory.  The orchestrator may already have
          # stopped it; ``|| true`` so a double-stop isn't a failure.
          case "${{ matrix.topology }}" in
            single)
              compose_args="-f tests/resiliency/compose/single/docker-compose.yml -p resiliency-single"
              ;;
            cluster3)
              compose_args="-f tests/monitoring/cluster-3node/docker-compose.yml -f tests/resiliency/compose/cluster3/monitoring-overlay.yml -p cluster-3node"
              ;;
            cluster5)
              compose_args="-f tests/monitoring/cluster-5node/docker-compose.yml -f tests/resiliency/compose/cluster5/monitoring-overlay.yml -p cluster-5node"
              ;;
            multimaster-failover)
              compose_args="-f tests/resiliency/compose/multimaster/docker-compose.yml -f tests/resiliency/compose/multimaster/docker-compose.failover.yml -p resiliency-multimaster"
              ;;
            multimaster-hothot)
              compose_args="-f tests/resiliency/compose/multimaster/docker-compose.yml -f tests/resiliency/compose/multimaster/docker-compose.hothot.yml -p resiliency-multimaster"
              ;;
            syndic)
              compose_args="-f tests/resiliency/compose/syndic/docker-compose.yml -p resiliency-syndic"
              ;;
          esac
          # shellcheck disable=SC2086  # intentional word-split of compose_args
          docker compose $compose_args stop prometheus || true
          sudo tar -czf prometheus-data.tar.gz "$PROM_DATA_DIR"

      - name: Collect Logs on Failure
        if: failure()
        run: |
          mkdir -p artifacts
          # Post-run disk report.  If this job was killed by the GHA
          # worker running out of inodes/space (see "Disk preflight"
          # above for the precedent), this is the last place we can
          # record the exhausted state before Upload Artifacts.
          {
            echo "=== df -h ==="
            df -h / /tmp 2>&1 || true
            echo
            echo "=== /tmp top-level entries (ls, no recursion) ==="
            ls -la /tmp 2>/dev/null | head -20 || true
            echo
            echo "=== docker ps -s (size) ==="
            docker ps -s 2>&1 | head -30 || true
            echo
            echo "=== top-20 container json.log sizes (stat, bytes) ==="
            sudo stat --printf='%s %n\n' /var/lib/docker/containers/*/*-json.log 2>/dev/null \
                | sort -rn | head -20 || true
          } > artifacts/disk-usage.txt
          # Containers vary per topology.  List them, grep by project
          # name, dump each.  Cap each container log at 50 MB tail --
          # cluster5 masters routinely produce >300 MB json.log on
          # overlapping Errno-22 traceback storms (see
          # resiliency-cluster5-43824366115 c5-salt-master-3.log at
          # 340 MB/17.5k traceback repetitions) and a 3-master cluster3
          # on a worker that's already OOMed can't afford to dump the
          # full streams uncompressed.  50 MB tail is enough to see the
          # terminal crash context.
          case "${{ matrix.topology }}" in
            single)              project=resiliency-single       ;;
            cluster3)            project=cluster-3node           ;;
            cluster5)            project=cluster-5node           ;;
            multimaster-*)       project=resiliency-multimaster  ;;
            syndic)              project=resiliency-syndic       ;;
          esac
          for c in $(docker ps -a --filter "label=com.docker.compose.project=${project}" --format '{{.Names}}'); do
            docker logs --tail 200000 "$c" 2>&1 \
                | tail -c 52428800 \
                > "artifacts/${c}.log" || true
          done
          # Pull the per-run orchestrator artefacts (results.jsonl,
          # analysis.txt, compose.log, per-scenario logs) under
          # artifacts/ so they live alongside the container logs in the
          # uploaded bundle.
          cp -r tests/resiliency/results artifacts/results 2>/dev/null || true

      - name: Upload Artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resiliency-${{ matrix.topology }}-${{ matrix.group }}-${{ github.run_id }}
          path: |
            artifacts/
            prometheus-data.tar.gz
            tests/resiliency/results/

      - name: Publish panels to resiliency-snapshots branch
        # GitHub's step-summary sanitizer strips ``data:`` URIs but
        # allows real ``https:`` image URLs, so push rendered PNGs to a
        # dedicated ``resiliency-snapshots`` orphan branch and let the
        # summary embed them via ``raw.githubusercontent.com``.  Pruned
        # 14 days back so the branch stays small.  Skipped silently
        # when no PNGs exist (e.g. early-stage failures).
        id: publish-snapshots
        if: always() && hashFiles('artifacts/panels/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH=resiliency-snapshots
          RUN_DIR="runs/${{ github.run_id }}/${{ matrix.topology }}-${{ matrix.group }}"

          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 --branch="$BRANCH" "$REPO_URL" snaps
          else
            git clone --depth=1 "$REPO_URL" snaps
            cd snaps
            git switch --orphan "$BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          mkdir -p "snaps/$RUN_DIR"
          cp artifacts/panels/*.png "snaps/$RUN_DIR/"

          cd snaps
          # Drop any run directory older than 14 days so the branch
          # never accumulates unbounded.
          find runs -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + 2>/dev/null || true

          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add -A
          if ! git commit -m "Resiliency run ${{ github.run_id }} / ${{ matrix.topology }} / ${{ matrix.group }}"; then
            echo "nothing to commit"
          else
            # Tiny retry loop in case two topologies in the matrix push
            # concurrently.
            for attempt in 1 2 3; do
              if git push origin "$BRANCH"; then
                break
              fi
              echo "push attempt $attempt failed; rebasing"
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
            done
          fi

          URL_PREFIX="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/${RUN_DIR}/"
          echo "url-prefix=${URL_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Published panels under ${URL_PREFIX}"

      - name: Panel Summary
        # Build the workflow step summary from the PNGs the Render step
        # already produced; by this point prometheus is stopped so
        # re-querying would return no data.  ``--image-url-prefix``
        # points at the resiliency-snapshots branch so each panel
        # renders inline; without it the summary falls back to listing
        # the artifact bundle.
        #
        # The ``RESILIENCY_PANEL_*`` envs + ``--repo`` arg feed the
        # provenance header (``## Resiliency Run — <topology> /
        # <run_id>`` + SHA / start / Actions-run link) at the top of
        # the summary so a glance at the Actions page tells you which
        # commit the panels belong to.  Same values the render step
        # used, so header + per-panel suptitle stay consistent.
        if: always()
        env:
          RESILIENCY_PANEL_TOPOLOGY: ${{ matrix.topology }}-${{ matrix.group }}
          RESILIENCY_PANEL_RUN_ID: ${{ github.run_id }}
          RESILIENCY_PANEL_SHA: ${{ github.sha }}
          RESILIENCY_PANEL_STARTED_AT: ${{ steps.start-env.outputs.run-started-at }}
        run: |
          PANELS_DIR="${GITHUB_WORKSPACE}/artifacts/panels" \
            python3 tests/monitoring/render_panels.py --summary --from-existing \
              --artifact-name resiliency-${{ matrix.topology }}-${{ matrix.group }}-${{ github.run_id }} \
              --artifact-url "${{ steps.upload-artifacts.outputs.artifact-url }}" \
              --image-url-prefix "${{ steps.publish-snapshots.outputs.url-prefix }}" \
              --repo "${{ github.repository }}"
