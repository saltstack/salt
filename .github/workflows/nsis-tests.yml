---
name: Test NSIS Installer

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files
      full:
        required: true
        type: boolean
        description: Is this a full testrun or not
      ci-python-version:
        required: true
        type: string
        description: The version of python to use for the workflow run


jobs:
  Test-NSIS-Logic:
    name: Logic Tests
    runs-on:
      - windows-latest
    if: ${{ inputs.full || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) || fromJSON(inputs.changed-files)['nsis_tests'] }}

    steps:

    - name: Checkout Salt
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set Up Python ${{ inputs.ci-python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "${{ inputs.ci-python-version }}"

    - name: Install NSIS
      run: .\pkg\windows\install_nsis.cmd -CICD
      shell: cmd

    - name: Build Test Installer
      run: .\pkg\windows\nsis\tests\setup.cmd -CICD
      shell: cmd

    - name: Run Config Tests
      run: .\pkg\windows\nsis\tests\test.cmd -CICD .\config_tests
      shell: cmd

    - name: Collect NSIS Installer Logs
      if: always()
      shell: pwsh
      run: |
        $dest = "$env:GITHUB_WORKSPACE\nsis-install-logs"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        if (Test-Path "$env:TEMP\SaltInstaller") {
          Copy-Item "$env:TEMP\SaltInstaller\*" $dest -Recurse -Force
        }

    - name: Upload NSIS Installer Logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nsis-logic-test-logs
        path: nsis-install-logs
        if-no-files-found: ignore

  Test-NSIS-Stress:
    name: Stress Tests
    runs-on:
      - windows-latest
    if: ${{ inputs.full || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) || fromJSON(inputs.changed-files)['nsis_tests'] }}

    steps:

      - name: Checkout Salt
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set Up Python ${{ inputs.ci-python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ inputs.ci-python-version }}"

      - name: Install NSIS
        run: .\pkg\windows\install_nsis.cmd -CICD
        shell: cmd

      - name: Build Test Installer
        run: .\pkg\windows\nsis\tests\setup.cmd -CICD
        shell: cmd

      - name: Run Stress Test
        run: .\pkg\windows\nsis\tests\test.cmd -CICD .\stress_tests
        shell: cmd

      - name: Collect NSIS Installer Logs
        if: always()
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\nsis-install-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "$env:TEMP\SaltInstaller") {
            Copy-Item "$env:TEMP\SaltInstaller\*" $dest -Recurse -Force
          }

      - name: Upload NSIS Installer Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nsis-stress-test-logs
          path: nsis-install-logs
          if-no-files-found: ignore
