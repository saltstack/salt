name: Nightly Stress Test
run-name: "Nightly Stress Test (branch: ${{ github.ref_name }})"

# No `schedule:` here -- run-nightly-stress.yml is the sole cron owner
# and the sole source of the branch list (matching nightly.yml /
# run-nightly.yml's split). This file only ever dispatches
# run-stress-test.yml for the branch it itself is running on
# (github.ref_name), so `workflow_dispatch --ref X` from
# run-nightly-stress.yml's matrix is what selects the branch -- not an
# input here.
on:
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Repo-level opt-out. Set `SKIP_NIGHTLY_STRESS_TEST=true` on repos where
    # this shouldn't run (e.g. saltstack/salt — the stress test's runner cost
    # belongs on the salt-nightlies fork alongside the other nightlies infra).
    if: vars.SKIP_NIGHTLY_STRESS_TEST != 'true'
    permissions:
      actions: write
    steps:
      - name: Trigger run-stress-test.yml for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run run-stress-test.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f branch="${{ github.ref_name }}"
